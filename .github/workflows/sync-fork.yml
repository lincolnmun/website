name: Sync fork for deployment

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to munleadership fork
        run: |
          git remote add fork https://x-access-token:${{ secrets.FORK_DEPLOY_TOKEN }}@github.com/lincolnmun/website.git
          git push fork main --force
